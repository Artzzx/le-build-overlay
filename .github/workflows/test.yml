# Tests on every push and pull request, on Linux and Windows: the release is built on Windows,
# and Windows-only breakage (console encoding, paths) must show up here, not at release time.
name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r extractor/requirements.txt
      # No install scripts needed: Electron (42+) downloads itself on first run, and tests don't run it.
      - run: npm ci --ignore-scripts
      - run: npm test
